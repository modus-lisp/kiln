# A FRESH MAC, FROM NOTHING TO A DESKTOP.
#
# The image job proves the container path.  This proves the other one: `kiln local', which
# needs no container at all and is the path somebody sitting at a Mac actually takes — and
# the one that broke twice this week in ways the container job could not see, because a
# missing host prerequisite and a missing sibling checkout are not things an image has.
#
# It is deliberately the WHOLE way from nothing: brew for SBCL and SDL2, Quicklisp fetched
# and installed, the repo closure seeded and cloned through cairn exactly as the image does
# it, a core built from source, and then a desktop started and asked questions over its own
# control socket.  A runner is the only honest fresh machine available; every step it skips
# is a step somebody would otherwise discover by hand.
#
# HEADLESS VIA SDL_VIDEODRIVER=dummy.  A GitHub runner has no window server to open a real
# window on, and dummy is SDL's own answer for that — glass-sdl's bindings-probe already
# leans on it.  What that does NOT cover is anything the window server decides: the granted
# window size, the Retina scale, live-resize.  Those need a real Mac and are checked by hand.
name: macos

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turnkey:
    runs-on: macos-latest
    # Cloning 38 repos and compiling McCLIM from source is the long pole, once.
    timeout-minutes: 60
    env:
      MODUS_ROOT: ${{ github.workspace }}/modus-lisp
      KILN_SEED:  ${{ github.workspace }}/kiln-seed
      KILN_ROOT:  ${{ github.workspace }}/modus-lisp
      KILN_ETC:   ${{ github.workspace }}/dot-kiln
      KILN_STATE: ${{ github.workspace }}/dot-kiln
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with: { path: modus-lisp/kiln }

      - name: What a fresh Mac needs
        run: |
          brew install sbcl sdl2
          sbcl --version
          # THE LIBRARY, NOT THE HEADERS.  glass-sdl dlopens libSDL2 by name at runtime;
          # nothing here compiles against it, so this is a check that the dylib exists
          # rather than that a toolchain can find it.
          ls -l "$(brew --prefix)/lib/libSDL2"*.dylib | head -2

      - name: Quicklisp
        run: |
          curl -fsSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load /tmp/quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' >/dev/null
          test -f "$HOME/quicklisp/setup.lisp"

      # THE DOCUMENTED COMMAND, not the three steps inside it.  The README says
      # `bin/kiln build', so that is what a fresh machine is tested with — reaching past it
      # to seed.sh and clone-org.lisp would test pieces that work while the command somebody
      # actually types stays broken, which is how `kiln local' came to have no way of getting
      # the repos it reads.
      - name: bin/kiln build — the workspace and a core, on this machine
        working-directory: modus-lisp/kiln
        run: ./bin/kiln build "$MODUS_ROOT"

      - name: Every repo is pinned to the commit repos.lock names
        working-directory: modus-lisp/kiln
        run: |
          fail=0
          while read -r name branch commit; do
            case "$name" in \#*|"") continue ;; esac
            [ -d "$MODUS_ROOT/$name" ] || { echo "::error::$name was not cloned"; fail=1; continue; }
            have=$(git -C "$MODUS_ROOT/$name" rev-parse HEAD 2>/dev/null)
            [ "$have" = "$commit" ] || { echo "::error::$name: want $commit, have ${have:-nothing}"; fail=1; }
          done < repos.lock
          [ "$fail" = 0 ] && echo "all repos match repos.lock"
          exit $fail

      - name: ...and running it again changes nothing
        working-directory: modus-lisp/kiln
        run: |
          # Idempotent because the reason to run it twice is that something went wrong in one
          # half.  A second run that re-cloned 38 repos, or spent a minute re-dumping a core
          # that is already correct, would make the retry the expensive thing.
          before=$(stat -f %m "$KILN_ETC/modus.core")
          out=$(./bin/kiln build "$MODUS_ROOT" 2>&1); echo "$out"
          case "$out" in *"already here"*) ;; *) echo "::error::second run re-cloned"; exit 1 ;; esac
          [ "$(stat -f %m "$KILN_ETC/modus.core")" = "$before" ] \
            || { echo "::error::second run re-dumped the core"; exit 1; }

      - name: The gates glass ships
        working-directory: modus-lisp
        run: |
          # Run them against the CORE rather than from source: it is what a desktop runs,
          # and a gate that only passes against a fresh compile does not say much about it.
          fail=0
          for g in glass/inspect/density-gate.lisp \
                   glass/inspect/chrome-scale-gate.lisp \
                   glass/inspect/menu-gesture-gate.lisp \
                   glass/inspect/mic-gate.lisp \
                   glass/inspect/focus-history-gate.lisp \
                   glass/inspect/content-scale-gate.lisp; do
            [ -f "$g" ] || { echo "::error::$g is missing"; fail=1; continue; }
            echo "== $g"
            sbcl --core "$KILN_ETC/modus.core" --dynamic-space-size 4096 \
                 --noinform --disable-debugger --load "$g" \
              || { echo "::error::$g failed"; fail=1; }
          done
          exit $fail

      - name: A desktop starts, and answers over its own control socket
        working-directory: modus-lisp/kiln
        run: |
          # --mic=off and no --speaker: a runner has no devices, and asking for them would
          # test the runner rather than kiln.  SDL_VIDEODRIVER=dummy is set for the job.
          ./bin/kiln local --view --control --mic=off --size=800x600 --apps=terminal --detach

          log="$KILN_STATE/session-1.log"
          # SAY WHAT IT SAW, whatever happens.  A CI step that fails without showing the log
          # is a step you debug by pushing again, and each push here is four minutes.
          for i in $(seq 1 60); do
            sock=$(sed -n 's/^kiln: control  *//p' "$log" 2>/dev/null | tail -1)
            [ -n "$sock" ] && [ -S "$sock" ] && break
            sleep 2
          done
          echo "--- session log ---"
          grep -vE '^;' "$log" 2>/dev/null | tail -25 || echo "(no log at $log)"
          echo "--- control socket ---"
          echo "path from log: ${sock:-<none>}"
          ls -l "$sock" 2>/dev/null || echo "(no socket)"
          pgrep -fl modus.core || echo "(no desktop process)"
          [ -n "$sock" ] && [ -S "$sock" ] || { echo "::error::the desktop never opened its control socket"; exit 1; }

          # ASK THE RUNNING DESKTOP, rather than grepping its log: a log line says something
          # was printed, and this says the thing is there and answering.
          out=$(./bin/kiln eval '(list :name glass:*desktop-name*
                                       :surfaces (length (clim-glass::glass-port-surfaces
                                                          (clim-glass:find-glass-port)))
                                       :menu (length (clim-glass::wm-default-menu))
                                       :scale (clim-glass:seat-scale
                                               (clim-glass:port-seat (clim-glass:find-glass-port))))' 2>&1)
          echo "--- what it answered ---"
          echo "$out"
          case "$out" in
            *"SURFACES 0"*) echo "::error::no windows — --apps=terminal did not open one"; exit 1 ;;
            *"NAME NIL"*)   echo "::error::the session has no name"; exit 1 ;;
            *MENU*)         echo "the desktop answered" ;;
            *)              echo "::error::no answer from the control socket"; exit 1 ;;
          esac

      - name: ...and stops cleanly
        if: always()
        working-directory: modus-lisp/kiln
        run: |
          pkill -f modus.core || true
          sleep 2
          pgrep -f modus.core && { echo "::error::the desktop did not stop"; exit 1; } || echo "stopped"
