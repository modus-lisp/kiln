# The end-to-end gate: build the image the way a person would, then make the
# desktop prove itself inside it.  glass's self-test draws a known pattern,
# reads it back through an in-process RFB client and asserts the pixels, so a
# green run here means the whole stack — cairn's clone, the McCLIM build, the
# saved core — actually produced a working display.
name: image

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Compiling McCLIM from source is the long pole, and it only happens once.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # --progress=plain, because buildkit collapses each step to its last few
        # lines and this build's interesting failures are Lisp backtraces in the
        # middle of one.  A gate you cannot read the failure of costs more than it
        # saves.
        run: docker build --progress=plain -t modus-lisp/kiln .

      - name: glass RFB self-test
        run: docker run --rm modus-lisp/kiln test

      - name: The desktop starts and serves RFB
        run: |
          # GLASS_BIND, and it is not optional: glass binds 127.0.0.1 by default, which
          # is right for a desktop and wrong for a PUBLISHED port -- that arrives on the
          # container's own interface and cannot be delivered to a loopback socket.
          docker run -d --name kiln -p 5901:5901 -e GLASS_BIND=0.0.0.0 modus-lisp/kiln desktop
          # AND IT READS THE BANNER rather than merely connecting.  docker-proxy accepts
          # before it has anywhere to forward to, so `exec 3<>/dev/tcp' -- what this used
          # to do -- succeeds against a container with nothing listening at all.  A check
          # that cannot fail is worse than no check.  An RFB server announces itself
          # first, so the banner is the proof.
          for i in $(seq 1 60); do
            if [ "$(timeout 3 bash -c 'head -c 3 < /dev/tcp/127.0.0.1/5901' 2>/dev/null)" = RFB ]; then
              echo "RFB banner read from 5901"; ok=1; break
            fi
            sleep 1
          done
          docker logs kiln
          [ "${ok:-}" = 1 ] || { echo "::error::no RFB banner on 5901"; exit 1; }

      - name: Every repo is pinned to the commit repos.lock names
        run: |
          docker run --rm modus-lisp/kiln sh -c '
            fail=0
            while read -r name branch commit; do
              case "$name" in \#*|"") continue ;; esac
              have=$(cat "/opt/modus-lisp/$name/.git/HEAD" 2>/dev/null)
              case "$have" in
                ref:*) ref=${have#ref: }
                       have=$(cat "/opt/modus-lisp/$name/.git/$ref" 2>/dev/null) ;;
              esac
              if [ "$have" != "$commit" ]; then
                echo "MISMATCH $name: want $commit, have ${have:-nothing}"; fail=1
              fi
            done < /kiln/repos.lock
            [ "$fail" = 0 ] && echo "all repos match repos.lock"
            exit $fail'
